version: "3.8"

services:
  barsi-worker:
    build: .
    container_name: barsi_quant_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./memory:/app/memory
      - ./cache:/app/cache
      - ./extratos:/app/extratos
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 350M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3


