version: "3.8"

services:
  barsi-worker:
    build: .
    container_name: barsi_quant_worker
    restart: unless-stopped
    environment:
      - BARSI_ENV=production
      - BARSI_AI_PROVIDER=rule_engine
      - BARSI_MARKET_PROVIDER=yfinance
    volumes:
      - ./memory:/app/memory
      - ./cache:/app/cache
      - ./credentials.json:/app/credentials.json:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 250M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

