[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barsi-quant-ia"
version = "1.0.0"
description = "Sistema Previdenciário Barsi - Agente Quantitativo Resiliente para Edge/SBC e Cloudflare"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Barsi Quant Developer", email = "dev@barsi-quant.local" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "openpyxl>=3.1.2",
    "gspread>=6.0.0",
    "google-auth>=2.28.0",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "psutil>=5.9.8",
    "diskcache>=5.6.3",
    "boto3>=1.34.0",
    "yfinance>=0.2.38",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "pandas>=2.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
barsi = "barsi.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/barsi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
omit = [
    "src/barsi/__main__.py",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E9",
    "F",
]
ignore = [
    "F401",
    "F841",
    "E501",
]



