<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="8" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="150" fill="rgba(16, 185, 129, 0.08)" />

  <!-- Barsi Shield & Chart Path -->
  <path d="M 160 330 L 210 260 L 270 290 L 350 180" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow Head -->
  <polygon points="350,150 370,195 325,185" fill="#10b981" />

  <!-- Quant Dots -->
  <circle cx="160" cy="330" r="14" fill="#f59e0b" />
  <circle cx="210" cy="260" r="14" fill="#f59e0b" />
  <circle cx="270" cy="290" r="14" fill="#10b981" />
  <circle cx="350" cy="180" r="14" fill="#10b981" />

  <!-- Monogram B -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">BARSI</text>
</svg>

