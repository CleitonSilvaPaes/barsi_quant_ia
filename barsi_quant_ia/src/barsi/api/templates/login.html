<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{CSRF_TOKEN}}">
  <title>Login — Barsi Quant IA</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; border: 1px solid #334155; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { color: #38bdf8; margin-top: 0; text-align: center; margin-bottom: 1.5rem; font-size: 1.5rem; }
    input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #475569; border-radius: 0.5rem; color: #fff; font-size: 1rem; }
    input:focus { outline: none; border-color: #38bdf8; }
    button.btn-primary { width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none; border-radius: 0.5rem; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button.btn-primary:hover { background: #1d4ed8; }
    .btn-google { width: 100%; padding: 0.75rem; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 0.5rem; font-weight: 500; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.65rem; text-decoration: none; transition: background 0.2s, border-color 0.2s; }
    .btn-google:hover { background: #1e293b; border-color: #38bdf8; }
    .divider { display: flex; align-items: center; text-align: center; margin: 1.25rem 0; color: #64748b; font-size: 0.8rem; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
    .divider:not(:empty)::before { margin-right: 0.75em; }
    .divider:not(:empty)::after { margin-left: 0.75em; }
    .err { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 0.5rem; padding: 0.65rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 Barsi Quant IA</h2>
    {{ERROR_MSG}}
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}" />
      <input type="text" name="username" placeholder="Usuário ou e-mail" autofocus required />
      <input type="password" name="password" placeholder="Senha" required />
      <button type="submit" class="btn-primary">Entrar no Painel</button>
    </form>
    <div class="divider">ou</div>
    <a href="/auth/google/login" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Continuar com Google
    </a>
  </div>
</body>
</html>
