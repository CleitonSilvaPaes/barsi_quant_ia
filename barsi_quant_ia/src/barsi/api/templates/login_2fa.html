<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{CSRF_TOKEN}}">
  <title>Two-factor authentication · Barsi Quant IA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container svg {
      fill: #ffffff;
      width: 48px;
      height: 48px;
    }
    .auth-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 8px 24px rgba(1, 4, 9, 0.4);
      text-align: center;
    }
    h2 {
      font-size: 20px;
      font-weight: 500;
      color: #f0f6fc;
      margin: 0 0 12px 0;
    }
    p.subtitle {
      font-size: 14px;
      color: #8b949e;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .totp-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 6px;
      text-align: center;
      color: #c9d1d9;
      background-color: #0d1117;
      border: 1px solid #1f6feb;
      border-radius: 6px;
      outline: none;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.25);
      margin-bottom: 16px;
      font-family: monospace;
    }
    .totp-input::placeholder {
      color: #484f58;
      letter-spacing: 6px;
    }
    .btn-verify {
      width: 100%;
      background-color: #238636;
      color: #ffffff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 12px;
    }
    .btn-verify:hover {
      background-color: #2ea043;
    }
    .btn-options {
      width: 100%;
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-options:hover {
      background-color: #30363d;
      color: #f0f6fc;
    }
    .err {
      background-color: rgba(248, 81, 73, 0.15);
      border: 1px solid rgba(248, 81, 73, 0.4);
      color: #f85149;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <svg height="48" aria-hidden="true" viewBox="0 0 24 24" version="1.1" width="48" data-view-component="true">
      <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2Z"></path>
    </svg>
  </div>

  <div class="auth-card">
    <h2>Two-factor authentication</h2>
    <p class="subtitle">Enter the code from your two-factor authentication app or browser extension below.</p>
    {{ERROR_MSG}}
    <form method="POST" action="/login/2fa">
      <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}" />
      <input
        type="text"
        name="totp_code"
        class="totp-input"
        placeholder="XXXXXX"
        maxlength="6"
        autocomplete="one-time-code"
        autofocus
        required
      />
      <button type="submit" class="btn-verify">Verify</button>
    </form>
    <a href="/login" class="btn-options">
      More options (retornar)
      <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
        <path d="m4.427 7.427 3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427Z"></path>
      </svg>
    </a>
  </div>
</body>
</html>
