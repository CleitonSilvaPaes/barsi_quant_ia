<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{CSRF_TOKEN}}">
  <title>2FA — Barsi Quant IA</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; border: 1px solid #334155; width: 100%; max-width: 360px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #38bdf8; margin-top: 0; margin-bottom: 0.75rem; font-size: 1.5rem; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; line-height: 1.4; margin-bottom: 1.5rem; }
    input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #475569; border-radius: 0.5rem; color: #fff; font-size: 1.3rem; letter-spacing: 6px; text-align: center; font-family: monospace; }
    input:focus { outline: none; border-color: #38bdf8; }
    button.btn-primary { width: 100%; padding: 0.75rem; background: #2563eb; color: #fff; border: none; border-radius: 0.5rem; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    button.btn-primary:hover { background: #1d4ed8; }
    .back-link { display: inline-block; margin-top: 1rem; color: #94a3b8; font-size: 0.85rem; text-decoration: none; }
    .back-link:hover { color: #38bdf8; text-decoration: underline; }
    .err { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 0.5rem; padding: 0.65rem; margin-bottom: 1rem; font-weight: 500; font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>🔐 Autenticação 2FA</h2>
    <p class="subtitle">Digite o código de 6 dígitos gerado pelo seu aplicativo autenticador.</p>
    {{ERROR_MSG}}
    <form method="POST" action="/login/2fa">
      <input type="hidden" name="csrf_token" value="{{CSRF_TOKEN}}" />
      <input
        type="text"
        name="totp_code"
        placeholder="000000"
        maxlength="6"
        autocomplete="one-time-code"
        autofocus
        required
      />
      <button type="submit" class="btn-primary">Verificar e Entrar</button>
    </form>
    <a href="/login" class="back-link">← Voltar para o login</a>
  </div>
</body>
</html>
