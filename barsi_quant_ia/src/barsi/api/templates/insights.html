<div class="grid-stats">
  <div class="stat-card">
    <h4>Taxa de Concordância (RLHF)</h4>
    <div class="val" id="stat-concordancia" style="color: var(--accent);">0%</div>
    <div class="sub" id="stat-concordancia-sub">Calculando validações...</div>
  </div>
  <div class="stat-card">
    <h4>Total de Insights Gerados</h4>
    <div class="val" id="stat-total-insights" style="color: #fff;">0</div>
    <div class="sub">Histórico em memória SQLite</div>
  </div>
  <div class="stat-card">
    <h4>Sinais de Compra (ACUMULAR)</h4>
    <div class="val" id="stat-acumular" style="color: var(--green);">0</div>
    <div class="sub">Ativos com margem positiva</div>
  </div>
  <div class="stat-card">
    <h4>Sinais de Espera (AGUARDAR)</h4>
    <div class="val" id="stat-aguardar" style="color: var(--amber);">0</div>
    <div class="sub">Ativos acima do teto</div>
  </div>
</div>

<div class="actions-bar">
  <div style="font-size: 0.9rem; color: var(--text-muted); display:flex; align-items:center; gap:0.5rem; flex-wrap: wrap;">
    <span>Filtrar por decisão:</span>
    <button class="btn btn-outline btn-filter active-filter" data-decisao="TODOS" onclick="filtrarCards('TODOS', this)">Todos</button>
    <button class="btn btn-outline btn-filter" data-decisao="ACUMULAR" onclick="filtrarCards('ACUMULAR', this)">🟢 ACUMULAR</button>
    <button class="btn btn-outline btn-filter" data-decisao="AGUARDAR" onclick="filtrarCards('AGUARDAR', this)">🟡 AGUARDAR</button>
  </div>
  <div style="margin-left: auto;">
    <button class="btn btn-primary" onclick="executarSync()">🚀 Rodar Nova Análise B3 & IA</button>
  </div>
</div>

<!-- Grid de Cards de Insights -->
<div id="cards-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.25rem;">
  <div style="color: var(--text-muted);">Carregando análises e diretrizes da IA...</div>
</div>

<!-- Controles de Paginação (P3) -->
<div id="pagination-controls" style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 1.5rem;"></div>

<script src="/static/js/insights.js"></script>
