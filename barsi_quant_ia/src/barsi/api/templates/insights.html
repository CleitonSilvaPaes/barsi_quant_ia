<div class="grid-stats">
  <div class="stat-card">
    <h4>Taxa de Concordância (RLHF)</h4>
    <div class="val" id="stat-concordancia" style="color: var(--accent);">0%</div>
    <div class="sub" id="stat-concordancia-sub">Calculando validações...</div>
  </div>
  <div class="stat-card">
    <h4>Total de Insights Gerados</h4>
    <div class="val" id="stat-total-insights" style="color: #fff;">0</div>
    <div class="sub">Histórico em memória SQLite</div>
  </div>
  <div class="stat-card">
    <h4>Sinais de Compra (ACUMULAR)</h4>
    <div class="val" id="stat-acumular" style="color: var(--green);">0</div>
    <div class="sub">Ativos com margem positiva</div>
  </div>
  <div class="stat-card">
    <h4>Sinais de Espera (AGUARDAR)</h4>
    <div class="val" id="stat-aguardar" style="color: var(--amber);">0</div>
    <div class="sub">Ativos acima do teto</div>
  </div>
</div>

<div class="actions-bar">
  <div style="font-size: 0.9rem; color: var(--text-muted); display:flex; align-items:center; gap:0.5rem;">
    <span>Filtrar por decisão:</span>
    <button class="btn btn-outline active-filter" onclick="filtrarCards('TODOS', this)">Todos</button>
    <button class="btn btn-outline" onclick="filtrarCards('ACUMULAR', this)">🟢 ACUMULAR</button>
    <button class="btn btn-outline" onclick="filtrarCards('AGUARDAR', this)">🟡 AGUARDAR</button>
  </div>
  <div style="margin-left: auto;">
    <button class="btn btn-primary" onclick="executarSync()">🚀 Rodar Nova Análise B3 & IA</button>
  </div>
</div>

<!-- Grid de Cards de Insights -->
<div id="cards-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 1.25rem;">
  <div style="color: var(--text-muted);">Carregando análises e diretrizes da IA...</div>
</div>

<script>
  let insightsData = [];
  let filtroDecisao = 'TODOS';
  let pendingFeedback = {};
  let feedbackDebounceTimer = null;

  async function carregarInsights() {
    try {
      const res = await fetch("/api/insights");
      const data = await res.json();
      insightsData = data.items || [];

      document.getElementById("stat-concordancia").innerText = `${data.taxa_concordancia}%`;
      document.getElementById("stat-concordancia-sub").innerText = `${data.validados_count} de ${data.total_count} análises validadas`;
      document.getElementById("stat-total-insights").innerText = data.total_count;
      document.getElementById("stat-acumular").innerText = data.acumular_count;
      document.getElementById("stat-aguardar").innerText = data.aguardar_count;

      renderizarCards();
    } catch (err) {
      document.getElementById("cards-container").innerHTML = `<div style="color:var(--red);">Erro ao carregar insights: ${err}</div>`;
    }
  }

  function filtrarCards(decisao, btnEl) {
    filtroDecisao = decisao;
    document.querySelectorAll('.actions-bar .btn').forEach(b => b.style.borderColor = 'var(--border)');
    if (btnEl) btnEl.style.borderColor = 'var(--accent)';
    renderizarCards();
  }

  function renderizarCards() {
    const container = document.getElementById("cards-container");
    container.innerHTML = "";

    const filtrados = insightsData.filter(item => {
      if (filtroDecisao === 'TODOS') return true;
      return item.acao_sugerida === filtroDecisao;
    });

    if (filtrados.length === 0) {
      container.innerHTML = `<div style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:2rem;">Nenhum insight encontrado para este filtro.</div>`;
      return;
    }

    filtrados.forEach(item => {
      const isAcumular = item.acao_sugerida === "ACUMULAR";
      const badgeClass = isAcumular ? "badge-acumular" : "badge-aguardar";
      const margemColor = item.margem >= 0 ? "var(--green)" : "var(--red)";

      const feedbackAtual = item.feedback_usuario || "";
      const isConcordo = feedbackAtual.toUpperCase().includes("CONCORDO");
      const isDiscordo = feedbackAtual.toUpperCase().includes("DISCORDO");

      const card = document.createElement("div");
      card.className = "card";
      card.style.margin = "0";
      card.style.display = "flex";
      card.style.flexDirection = "column";
      card.style.justifyContent = "space-between";

      card.innerHTML = `
        <div>
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <div>
              <strong style="font-size: 1.15rem; color: #fff;">${item.ticker}</strong>
              <div style="font-size: 0.78rem; color: var(--text-muted);">${item.empresa || ''} • <span style="color:var(--accent);">${item.setor || 'B.E.S.T.'}</span></div>
            </div>
            <span class="${badgeClass}" style="font-size: 0.8rem;">${item.acao_sugerida}</span>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; background: rgba(0,0,0,0.25); border-radius: 6px; padding: 0.6rem; margin-bottom: 1rem; text-align: center;">
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">COTAÇÃO</div>
              <div style="font-weight: 600;">R$ ${item.preco.toFixed(2)}</div>
            </div>
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">PREÇO TETO</div>
              <div style="font-weight: 600;">R$ ${item.teto.toFixed(2)}</div>
            </div>
            <div>
              <div style="font-size: 0.7rem; color: var(--text-muted);">MARGEM</div>
              <div style="font-weight: 700; color: ${margemColor};">${item.margem.toFixed(1)}%</div>
            </div>
          </div>

          <div style="margin-bottom: 1rem;">
            <div style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.25rem; font-weight: 700;">Raciocínio da IA (Chain-of-Thought):</div>
            <p style="font-size: 0.84rem; color: #cbd5e1; line-height: 1.45; background: #090d16; padding: 0.65rem 0.85rem; border-radius: 6px; border: 1px solid var(--border);">
              ${item.insight_ia || 'Margem de segurança atrativa para acúmulo previdenciário com base no Método Barsi.'}
            </p>
          </div>
        </div>

        <div>
          <div style="font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 700;">
            Validação Humana (RLHF):
            ${feedbackAtual ? `<span style="color:var(--green); text-transform:none; font-weight:normal; margin-left:5px;">✓ Atual: ${feedbackAtual}</span>` : ''}
          </div>

          <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
            <button onclick="enviarFeedback('${item.ticker}', 'CONCORDO')" class="btn ${isConcordo ? 'btn-green' : 'btn-outline'}" style="flex:1; justify-content:center; font-size:0.8rem;">
              👍 Concordo
            </button>
            <button onclick="enviarFeedback('${item.ticker}', 'DISCORDO')" class="btn ${isDiscordo ? 'btn-amber' : 'btn-outline'}" style="flex:1; justify-content:center; font-size:0.8rem;">
              👎 Discordo
            </button>
          </div>

          <div style="display: flex; gap: 0.35rem;">
            <input type="text" id="custom-fb-${item.ticker}" class="tbl-input" placeholder="Justificativa ou nota personalizada..." value="${(feedbackAtual !== 'CONCORDO' && feedbackAtual !== 'DISCORDO') ? feedbackAtual : ''}" style="font-size:0.78rem;" />
            <button onclick="enviarCustomFeedback('${item.ticker}')" class="btn btn-outline" style="padding:0.25rem 0.6rem; font-size:0.75rem;">Salvar</button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function enviarFeedback(ticker, voto) {
    // 1. Atualização Otimista na Interface
    pendingFeedback[ticker] = voto;
    const item = insightsData.find(i => i.ticker === ticker);
    if (item) {
      item.feedback_usuario = voto;
      renderizarCards();
    }
    showToast(`Gravado ${voto} para ${ticker} (salvando em lote...)`);

    // 2. Debounce de 2000ms para envio consolidado em batch
    if (feedbackDebounceTimer) clearTimeout(feedbackDebounceTimer);
    feedbackDebounceTimer = setTimeout(enviarBatchFeedback, 2000);
  }

  async function enviarBatchFeedback() {
    const tickers = Object.keys(pendingFeedback);
    if (tickers.length === 0) return;

    const payload = {
      items: tickers.map(t => ({ ticker: t, feedback: pendingFeedback[t] }))
    };
    pendingFeedback = {};

    try {
      const res = await fetch("/api/insights/feedback/batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const out = await res.json();
      showToast(`✓ ${out.count} feedback(s) sincronizados com sucesso no SQLite e Sheets!`, "success");
    } catch (err) {
      showToast("Erro ao sincronizar feedbacks em lote: " + err, "error");
    }
  }

  function enviarCustomFeedback(ticker) {
    const input = document.getElementById(`custom-fb-${ticker}`);
    const texto = (input.value || "").trim();
    if (!texto) return;
    enviarFeedback(ticker, texto);
  }

  window.addEventListener("beforeunload", () => {
    const tickers = Object.keys(pendingFeedback);
    if (tickers.length > 0) {
      const payload = {
        items: tickers.map(t => ({ ticker: t, feedback: pendingFeedback[t] }))
      };
      fetch("/api/insights/feedback/batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      });
    }
  });

  async function executarSync() {
    try {
      showToast("Executando análise completa de mercado...");
      const res = await fetch("/api/run", { method: "POST" });
      await res.json();
      showToast("Novos insights gerados com sucesso!");
      carregarInsights();
    } catch (err) {
      showToast("Erro na análise: " + err, "error");
    }
  }

  window.addEventListener("DOMContentLoaded", carregarInsights);
</script>
