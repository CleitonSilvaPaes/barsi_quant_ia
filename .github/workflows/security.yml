name: CI — Quality & Security Guard

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: PII & Secrets Guard (rápido, < 10s)
  # ─────────────────────────────────────────────────────────────
  pii-guard:
    name: 🔒 PII & Secrets Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Zero-PII Guard
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          python - << 'EOF'
          import os, subprocess, sys

          # Padrões genéricos seguros para ficar no código + padrões privados vindos dos Secrets
          patterns = [r"192\.168\.\d+\.\d+", r"10\.\d+\.\d+\.\d+"]
          
          secret_patterns = os.environ.get("FORBIDDEN_PATTERNS", "")
          if secret_patterns:
              patterns.extend([p.strip() for p in secret_patterns.split(",") if p.strip()])

          errors = []
          for p in patterns:
              res = subprocess.run(["git", "grep", "-inE", p], capture_output=True, text=True)
              if res.returncode == 0 and res.stdout.strip():
                  for line in res.stdout.splitlines():
                      if not line.startswith(".github/workflows/"):
                          errors.append(line)

          if errors:
              print("❌ SECURITY GUARD DETECTED FORBIDDEN PII OR DOMESTIC IP:")
              for err in errors:
                  print(f"   {err}")
              sys.exit(1)

          print("✅ ZERO PII & ZERO DOMESTIC IP: All git tracked files are clean.")
          EOF

  # ─────────────────────────────────────────────────────────────
  # Job 2: Lint Check (rápido, < 30s)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🧹 Lint Check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.6.9"

      - name: Ruff check
        run: ruff check barsi_quant_ia/src barsi_quant_ia/tests --output-format=github

  # ─────────────────────────────────────────────────────────────
  # Job 3 & 4: Pytest com matriz (3.11 + 3.12)
  # ─────────────────────────────────────────────────────────────
  pytest:
    name: 🧪 Pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: barsi_quant_ia/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e barsi_quant_ia/[dev]

      - name: Run Pytest with Coverage Gate (≥40%)
        run: |
          pytest barsi_quant_ia/tests/ -v \
            --cov=barsi \
            --cov-fail-under=40 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

  # ─────────────────────────────────────────────────────────────
  # Job 5: CI success summary (para o branch protection)
  # ─────────────────────────────────────────────────────────────
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [pii-guard, lint, pytest]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.pii-guard.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "❌ CI FAILED"
            exit 1
          fi
          echo "✅ All CI checks passed"
