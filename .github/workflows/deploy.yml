name: Deploy to TV Box

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente"
        required: true
        default: "tvbox"
        type: choice
        options:
          - tvbox
      confirm:
        description: "Digite DEPLOY (maiúsculo) para confirmar"
        required: true
        type: string

concurrency:
  group: deploy-tvbox
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy (TV Box via Tailscale SSH)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'DEPLOY')

    env:
      TARGET_DIR: ${{ secrets.TVBOX_HOME != '' && secrets.TVBOX_HOME || format('/home/{0}/barsi_quant_ia', secrets.TVBOX_USER) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────
      # 1. Entra no Tailnet (ephemeral)
      # ─────────────────────────────────────────────────────────
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # ─────────────────────────────────────────────────────────
      # 2. Detecta WorkingDirectory remoto diretamente do systemd
      # ─────────────────────────────────────────────────────────
      - name: Detect remote working directory
        id: detect
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TVBOX_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          DETECTED=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_deploy -o ConnectTimeout=8 ${{ secrets.TVBOX_USER }}@${{ secrets.TVBOX_HOST }} 'DIR=$(systemctl show -p WorkingDirectory --value barsi-api.service 2>/dev/null || true); [ -n "$DIR" ] && [ -d "$DIR" ] && echo "$DIR" || true')
          rm -f ~/.ssh/id_deploy
          if [ -n "$DETECTED" ]; then
            TARGET="$DETECTED"
          elif [ -n "${{ secrets.TVBOX_HOME }}" ]; then
            TARGET="${{ secrets.TVBOX_HOME }}"
          else
            TARGET="/home/${{ secrets.TVBOX_USER }}/barsi_quant_ia"
          fi
          echo "📂 Diretório remoto resolvido: $TARGET"
          echo "dir=$TARGET" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────
      # 3. Backup do código e SQLite ANTES de mexer em qualquer arquivo
      # ─────────────────────────────────────────────────────────
      - name: Backup code and SQLite (rollback safety)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TVBOX_HOST }}
          username: ${{ secrets.TVBOX_USER }}
          key: ${{ secrets.TVBOX_SSH_KEY }}
          script: |
            set -e
            TARGET_DIR="${{ steps.detect.outputs.dir }}"
            echo "📂 Usando diretório de trabalho: $TARGET_DIR"
            cd "$TARGET_DIR"

            # 1. Backup do SQLite
            BACKUP_NAME="memory/barsi_memory.db.bak.$(date +%Y%m%d_%H%M%S)"
            cp memory/barsi_memory.db "$BACKUP_NAME"
            echo "✅ Backup SQLite criado: $BACKUP_NAME"
            ls -t memory/barsi_memory.db.bak.* 2>/dev/null | tail -n +8 | xargs rm -f || true

            # 2. Backup do Código anterior em memory/ (não volátil, imune a reboot)
            rm -rf memory/barsi_code_prev
            cp -r src/barsi memory/barsi_code_prev
            echo "✅ Código anterior preservado em $TARGET_DIR/memory/barsi_code_prev"

      # ─────────────────────────────────────────────────────────
      # 4. Sync do código fonte via rsync (delta transfer)
      # ─────────────────────────────────────────────────────────
      - name: Deploy code via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='__pycache__' --exclude='*.pyc'
          path: barsi_quant_ia/src/barsi/
          remote_path: ${{ steps.detect.outputs.dir }}/src/barsi/
          remote_host: ${{ secrets.TVBOX_HOST }}
          remote_user: ${{ secrets.TVBOX_USER }}
          remote_key: ${{ secrets.TVBOX_SSH_KEY }}

      # ─────────────────────────────────────────────────────────
      # 5. Restart + health check
      # ─────────────────────────────────────────────────────────
      - name: Restart & Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TVBOX_HOST }}
          username: ${{ secrets.TVBOX_USER }}
          key: ${{ secrets.TVBOX_SSH_KEY }}
          script: |
            set -e
            echo "🔄 Reiniciando barsi-api.service..."
            sudo systemctl restart barsi-api.service

            echo "⏳ Aguardando 10s para inicialização do Uvicorn no processador ARM64..."
            sleep 10

            echo "🏥 Health check com validação de reinicialização fresca..."
            for i in $(seq 1 15); do
              STATUS_CODE=$(curl -s -o /tmp/health_resp.json -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS_CODE" = "200" ]; then
                UPTIME=$(python3 -c "import json; print(json.load(open('/tmp/health_resp.json')).get('uptime_sec', 999))" 2>/dev/null || echo 999)
                if [ "$UPTIME" -lt 120 ]; then
                  echo "✅ Health check OK — novo processo ativo (uptime: ${UPTIME}s)"
                  python3 -m json.tool < /tmp/health_resp.json || true
                  exit 0
                else
                  echo "⚠️ Respondeu 200, mas uptime (${UPTIME}s) indica processo anterior; aguardando novo processo..."
                fi
              fi
              echo "⏳ Tentativa $i/15 falhou (status: $STATUS_CODE), aguardando 2s..."
              sleep 2
            done

            echo "❌ Health check falhou após 15 tentativas"
            sudo systemctl status barsi-api.service || true
            sudo journalctl -u barsi-api.service -n 30 --no-pager || true
            exit 1

      # ─────────────────────────────────────────────────────────
      # 6. Rollback total em caso de falha (Código + Banco)
      # ─────────────────────────────────────────────────────────
      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TVBOX_HOST }}
          username: ${{ secrets.TVBOX_USER }}
          key: ${{ secrets.TVBOX_SSH_KEY }}
          script: |
            echo "🚨 Deploy falhou — iniciando rollback total do código e banco"
            TARGET_DIR="${{ steps.detect.outputs.dir }}"
            [ -z "$TARGET_DIR" ] && TARGET_DIR="/home/${{ secrets.TVBOX_USER }}/barsi_quant_ia"
            cd "$TARGET_DIR"

            # 1. Restaura CÓDIGO anterior
            if [ -d memory/barsi_code_prev ]; then
              rm -rf src/barsi
              cp -r memory/barsi_code_prev src/barsi
              echo "✅ Código anterior restaurado com sucesso de memory/barsi_code_prev"
            else
              echo "⚠️ memory/barsi_code_prev não encontrado — pulando rollback de código"
            fi

            # 2. Restaura BANCO SQLite anterior
            LATEST_BACKUP=$(ls -t memory/barsi_memory.db.bak.* 2>/dev/null | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              cp "$LATEST_BACKUP" memory/barsi_memory.db
              echo "✅ SQLite restaurado com sucesso de: $LATEST_BACKUP"
            fi

            echo "🔄 Reiniciando serviço barsi-api.service com estado restaurado..."
            sudo systemctl restart barsi-api.service || true

      # ─────────────────────────────────────────────────────────
      # 7. Limpeza de backup temporário em caso de sucesso
      # ─────────────────────────────────────────────────────────
      - name: Cleanup code backup on success
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TVBOX_HOST }}
          username: ${{ secrets.TVBOX_USER }}
          key: ${{ secrets.TVBOX_SSH_KEY }}
          script: |
            TARGET_DIR="${{ steps.detect.outputs.dir }}"
            [ -z "$TARGET_DIR" ] && TARGET_DIR="/home/${{ secrets.TVBOX_USER }}/barsi_quant_ia"
            rm -rf "$TARGET_DIR/memory/barsi_code_prev" 2>/dev/null || true
            echo "🧹 Backup temporário de código limpo com sucesso."

      # ─────────────────────────────────────────────────────────
      # 8. Notificação Telegram
      # ─────────────────────────────────────────────────────────
      - name: Notify Telegram
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            MSG="Deploy concluído"
          else
            ICON="❌"
            MSG="Deploy FALHOU (rollback aplicado)"
          fi

          COMMIT_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          REF="${{ github.ref_name }}"

          curl -s "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$ICON *$MSG*%0A📦 Ref: \`$REF\`%0A🔖 Commit: \`$COMMIT_SHORT\`%0A👤 Por: ${{ github.actor }}" || true
