name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: 🔖 Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          echo "## 🚀 O que mudou nesta versão" > release_notes.md
          echo "" >> release_notes.md
          git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### 📺 Deploy na TV Box" >> release_notes.md
          echo "Este release foi sincronizado e deployado automaticamente na TV Box via Tailscale." >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false

      # Mantem somente ultimos 3 releases
      - name: Keep only last 3 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lista todas as releases ordenadas da mais recente para a mais antiga, pula as 3 primeiras e apaga o resto
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | while read -r TAG; do
            if [ -n "$TAG" ]; then
              echo "🗑️ Removendo release antiga: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          done
